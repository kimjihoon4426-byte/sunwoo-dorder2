<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="선우 식자재 주문">
<title>선우식자재 주문서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#16222b;--sub:#5d6b73;--line:#d5ddd8;--green:#1f6f50;--on-green:#fff;--hl:#fff3b8;--star:#c48a00;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121a17;--card:#1b2622;--ink:#e8efeb;--sub:#9fb0a8;--line:#2f3e38;--green:#4cb98a;--on-green:#0b1712;--hl:#3d3a17;--star:#f0c040;--err:#f2867e}}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.5}
.top{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line);min-height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;gap:8px}
.top b{flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 130px}
h1{font-size:26px;font-weight:900;margin:0 0 4px;letter-spacing:-.02em;line-height:1.3}
h3{font-size:19px;margin:24px 0 6px}
.meta{color:var(--sub);font-size:15px;margin:2px 0 12px}
.banner{background:var(--hl);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:500;margin-bottom:12px}
.note{margin:0;font-size:15px;color:var(--green);font-weight:500}.note:empty{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.card p{margin:6px 0}
.ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--sub)}.ch b{color:var(--ink);font-size:18px}
.pill{background:var(--green);color:var(--on-green);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.tools{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:6px 0 8px}
input[type=search],input[type=text],input[type=password],input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;font-size:17px}
input:focus,textarea:focus,select:focus{border-color:var(--green);outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green);font-weight:700}
.only{margin-top:4px;border:0;background:none;color:var(--green);font:inherit;font-size:16px;font-weight:700;cursor:pointer;padding:8px 0}
.slip{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{padding:14px;border-top:1px solid var(--line)}
.slip .row:first-child{border-top:0}
.row.on{background:var(--hl)}
.name{font-size:18px;font-weight:700;line-height:1.35;word-break:keep-all}
.name i{font-style:normal;color:var(--star);margin-right:4px}
.sub{font-size:14px;color:var(--sub);margin-top:2px}
.ib{font-style:normal;font-weight:700;color:var(--green);margin-left:6px}
.used{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 9px;border-radius:999px;background:var(--green);color:var(--on-green);font-size:13px;font-weight:700;white-space:nowrap}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.step{display:flex;align-items:center}
.step button{width:54px;height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;padding:0}
.step button:first-child{border-radius:10px 0 0 10px}.step button:last-child{border-radius:0 10px 10px 0}
.step input{width:88px;height:48px;border:1px solid var(--line);border-left:0;border-right:0;text-align:center;font:inherit;font-size:20px;font-weight:700;background:var(--card);color:var(--ink);border-radius:0;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:17px;font-weight:700;color:var(--sub)}
.empty{padding:26px 16px;text-align:center;color:var(--sub);font-size:16px}
.extra{margin-top:14px;display:grid;gap:10px}
label{font-size:16px;font-weight:700;display:grid;gap:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bar div{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar p{margin:0;flex:1;font-size:16px;color:var(--sub)}.bar b{color:var(--ink);font-size:22px}
.go{border:0;background:var(--green);color:var(--on-green);font:inherit;font-size:18px;font-weight:700;padding:14px 22px;border-radius:12px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:11px 16px;border-radius:12px;cursor:pointer}
.ghost.sm{padding:8px 14px;font-size:15px}
.acts{display:flex;gap:10px;margin-top:10px}.acts button{flex:1;border-radius:10px;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.acts .ok{background:var(--green);color:var(--on-green);border-color:var(--green)}
table{width:100%;border-collapse:collapse;margin:10px 0;background:var(--card);border:1px solid var(--line);font-size:16px}
td,th{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}th{background:var(--line)}
td:last-child,th:last-child{text-align:right}
td:last-child{font-weight:700}
.log{font-size:15px;color:var(--sub);padding-left:20px;margin:6px 0}
.login{max-width:380px;margin:6vh auto 0;display:grid;gap:14px}
.login h1{font-size:30px}
.err{color:var(--err);font-size:16px;font-weight:500;min-height:1.5em}
.toast{position:fixed;left:14px;right:14px;bottom:100px;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-size:16px;z-index:20}
.done h2{margin:0 0 4px;font-size:24px}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="top" id="top" style="display:none"><b id="who"></b><button class="ghost sm" id="rf" style="display:none">새로고침</button><button class="ghost sm" id="lo">로그아웃</button></div>
<div class="wrap"><main id="app"><div class="empty">불러오는 중…</div></main></div>
<div class="bar" id="bar" style="display:none"><div><p>선택 <b id="cnt">0</b>개 품목</p><button class="go" id="go" disabled>주문 접수하기</button></div></div>
<script>
/* ===== 설정 ===== */
var SUPABASE_URL="https://stjwzoevobeymcmlwyew.supabase.co";
var SUPABASE_KEY="sb_publishable_EXadk8XxYw_2w1quKLx2fw_KrYZ-FUQ";
var EMAIL_DOMAIN="@sunwoo-order.com"; /* 지점 아이디 뒤에 자동으로 붙는 이메일 도메인 */
var CATS=["야채류","냉동류","냉장류","육류","공산품류"];

var sb=null;
try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
var S={role:null,items:[],byId:{},branchId:null,branchName:"",orders:{},count:{},fav:{},pend:[]};
var B={date:"",from:"",Q:{},edit:false,memo:"",chip:"전체",qs:"",only:false,done:null,busy:false};
var A={date:"",branches:[],reqs:[],orders:{},log:[],busy:false};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function kstNow(){return new Date(Date.now()+9*36e5)}
function tdy(){return kstNow().toISOString().slice(0,10)}
function addDays(d,n){var t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function tmr(){return addDays(tdy(),1)}
function closed(d){return kstNow().toISOString().slice(0,16)>=addDays(d,-1)+"T23:00"}
function locked(d){return d<=tdy()} /* 납품일 당일 00:00부터 거래처 변경 불가 */
function fmt(d){var t=new Date(d+"T00:00:00Z");return (t.getUTCMonth()+1)+"/"+t.getUTCDate()+"("+"일월화수목금토"[t.getUTCDay()]+")"}
function dl(d){var t=new Date(addDays(d,-1)+"T00:00:00Z");return (t.getUTCMonth()+1)+"월 "+t.getUTCDate()+"일 23:00"}
function fmtAt(s){try{return new Date(s).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}catch(e){return s}}
function pos(q){var r={};for(var k in q)if(q[k]>0)r[k]=q[k];return r}
function num(n){return Number(n)}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},4500)}
function fail(e){toast((e&&e.message)?e.message:"오류가 발생했습니다. 잠시 후 다시 시도해 주세요.")}
function unitTxt(it){return it.unit}
function packTxt(it){
  var p=it.pack_qty>1?"박스당 입수 "+it.pack_qty:"";
  if(it.unit==="EA")return (p?p+" · ":"")+"낱개 주문";
  return p;
}
function nm(id){var it=S.byId[id];return it?it.name:("품목 "+id)}
function un(id){var it=S.byId[id];return it?it.unit:""}
function sortedIds(q){return Object.keys(q).sort(function(a,b){var x=S.byId[a],y=S.byId[b];return (x?x.sort:9e9)-(y?y.sort:9e9)})}
function tbl(q){return '<table><tr><th>품명</th><th>수량</th></tr>'+sortedIds(q).map(function(k){return '<tr><td>'+esc(nm(k))+'</td><td>'+q[k]+' '+esc(un(k))+'</td></tr>'}).join('')+'</table>'}

/* ===== 초성 검색 ===== */
function cho(s){var J="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";return s.split("").map(function(ch){var c=ch.charCodeAt(0)-44032;return c>=0&&c<11172?J[Math.floor(c/588)]:ch}).join("")}
function hit(name,q){q=q.replace(/\s/g,"");if(!q)return true;var n=name.replace(/\s/g,"");return n.indexOf(q)>-1||(/^[ㄱ-ㅎ]+$/.test(q)&&cho(n).indexOf(q)>-1)}

/* ===== 로그인 ===== */
function showTop(name,isAdmin){$("top").style.display="";$("who").textContent=name;$("rf").style.display=isAdmin?"":"none"}
function showLogin(msg,idv){
  $("top").style.display="none";$("bar").style.display="none";S.role=null;
  $("app").innerHTML='<form class="login" id="lf"><h1>선우식자재 주문서 로그인</h1><div class="meta">지급받은 아이디와 비밀번호를 입력하세요. 사장님 계정은 이메일 주소 전체를 입력합니다. 한 번 로그인하면 이 기기에서는 유지됩니다.</div>'+
   '<label>아이디<input type="text" id="lid" value="'+esc(idv||"")+'" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>'+
   '<label>비밀번호<input type="password" id="lpw" autocomplete="current-password"></label>'+
   '<div class="err" id="lerr">'+esc(msg||"")+'</div><button class="go" id="lgo" type="submit" style="padding:14px">로그인</button></form>';
  $("lf").onsubmit=function(e){e.preventDefault();doLogin($("lid").value,$("lpw").value)};
}
async function doLogin(id,pw){
  id=(id||"").trim();
  if(!id||!pw){$("lerr").textContent="아이디와 비밀번호를 입력하세요.";return}
  var email=id.indexOf("@")>-1?id:id.toLowerCase()+EMAIL_DOMAIN;
  $("lgo").disabled=true;$("lgo").textContent="로그인 중…";
  var r=await sb.auth.signInWithPassword({email:email,password:pw});
  if(r.error){
    var m=r.error.message||"";
    showLogin(/not confirmed/i.test(m)?"이메일 확인이 되지 않은 계정입니다. 사장님께 문의해 주세요.":/invalid login/i.test(m)?"아이디 또는 비밀번호가 올바르지 않습니다.":"로그인 오류: "+m,id);
    return;
  }
  await enter();
}
async function enter(){
  try{
    var a=await sb.rpc("is_admin");
    if(a.error)throw a.error;
    if(a.data===true){S.role="admin";await loadAdmin();return}
    var b=await sb.rpc("my_branch_id");
    if(b.error)throw b.error;
    if(b.data){S.role="branch";S.branchId=b.data;await loadBranch();return}
    $("app").innerHTML='<div class="card"><b>연결된 지점이 없는 계정입니다.</b><p>사장님께 문의해 주세요.</p><button class="ghost" id="x">로그아웃</button></div>';
    $("x").onclick=logout;
  }catch(e){
    $("app").innerHTML='<div class="card"><b>불러오지 못했습니다.</b><p>'+esc(e.message||e)+'</p><button class="ghost" id="x">다시 시도</button></div>';
    $("x").onclick=function(){enter()};
  }
}
async function logout(){await sb.auth.signOut();showLogin()}

async function loadItems(){
  if(S.items.length)return;
  var r=await sb.from("items").select("id,name,unit,category,pack_qty,sort").eq("active",true).order("sort");
  if(r.error)throw r.error;
  S.items=r.data;S.byId={};r.data.forEach(function(i){S.byId[i.id]=i});
}

/* ===== 지점 화면 ===== */
async function fetchBranch(){
  await loadItems();
  var b=await sb.from("branches").select("id,name").eq("id",S.branchId).single();
  if(b.error)throw b.error;S.branchName=b.data.name;
  var o=await sb.from("orders").select("id,delivery_date,memo,order_lines(item_id,qty)").gte("delivery_date",addDays(tdy(),-90));
  if(o.error)throw o.error;
  S.orders={};S.count={};
  o.data.forEach(function(x){var q={};x.order_lines.forEach(function(l){q[l.item_id]=num(l.qty);S.count[l.item_id]=(S.count[l.item_id]||0)+1});S.orders[x.delivery_date]={q:q,memo:x.memo}});
  var f=await sb.from("branch_favorites").select("item_id");
  S.fav={};if(!f.error)f.data.forEach(function(r){S.fav[r.item_id]=1});
  var p=await sb.from("change_requests").select("id,delivery_date,to_date,kind,status").eq("status","대기");
  S.pend=p.error?[]:p.data;
}
async function loadBranch(){
  try{await fetchBranch()}catch(e){fail(e);return}
  if(!B.date)B.date=tmr();
  renderBranch();
}
function freq(){
  var ids=Object.keys(S.count).sort(function(a,b){return S.count[b]-S.count[a]||a-b}).slice(0,15),s={};
  ids.forEach(function(i){s[i]=1});Object.keys(S.fav).forEach(function(i){s[i]=1});return s;
}
function total(){var n=0;for(var k in B.Q)if(B.Q[k]>0)n++;return n}
function pendN(d){return S.pend.filter(function(r){return r.delivery_date===d}).length}
function moving(){return B.edit&&B.from&&B.date!==B.from}
function count(){
  var t=total(),ex=S.orders[B.date],mv=moving(),cl=closed(B.date)||(mv&&closed(B.from)),lk=locked(B.date);
  $("cnt").textContent=t;$("go").disabled=t===0||B.busy||lk;
  $("go").textContent=lk?"오늘은 변경 불가":mv?(cl?"납품일 변경 승인 요청하기":"납품일 변경 접수하기"):B.edit?(cl?"수정 승인 요청하기":"수정 내용 접수하기"):cl?"추가 주문 승인 요청하기":ex?"추가 주문 접수하기":"주문 접수하기";
  var n=$("nt");if(n){var p=pendN(B.date);
    if(lk){n.textContent="납품일 당일(자정 이후)에는 주문·변경할 수 없습니다. 사장님께 연락해 주세요.";return}
    if(mv){n.textContent="납품일을 "+fmt(B.from)+" → "+fmt(B.date)+"로 바꿉니다. 아래 품목을 확인·수정한 뒤 접수하세요."+(ex?" 이 날짜에 이미 주문이 있어 합산됩니다.":"")+(cl?" 마감(23시)이 지나 사장님 승인 후 반영됩니다.":"");return}
    n.textContent=(cl?"마감(23시)이 지났습니다. 자정 전까지 변경 요청을 보낼 수 있고, 사장님 승인 후 반영됩니다.":"마감 "+dl(B.date)+"까지 자유롭게 접수·수정·납품일 변경을 할 수 있습니다.")+(ex&&!B.edit&&!cl?" 이 날짜에 접수된 주문이 있어 추가 주문은 합산됩니다.":"")+(p?" (승인 대기 "+p+"건)":"")}
}
function exr(){
  var e=$("ex"),o=S.orders[B.date];if(!e)return;
  if(B.edit){e.style.display="";e.innerHTML='<b>'+fmt(B.from)+' 주문 수정 중'+(moving()?' → 새 납품일 '+fmt(B.date):'')+'</b><p class="sub">납품 희망일을 바꾸면 이 품목들이 그대로 새 날짜로 옮겨집니다.</p><button class="ghost sm" id="ce">수정 취소</button>';$("ce").onclick=function(){B.edit=false;B.date=B.from;B.from="";B.Q={};renderBranch()};return}
  if(!o){e.style.display="none";return}
  e.style.display="";
  e.innerHTML='<b>'+fmt(B.date)+' 접수 내역</b>'+tbl(o.q)+(o.memo?'<p>요청사항: '+esc(o.memo)+'</p>':'')+''+(locked(B.date)?'<p class="sub">납품일 당일이라 변경할 수 없습니다.</p>':'<div class="acts"><button id="ed">수정 (수량·납품일)</button><button id="cx">주문 취소</button></div>');
  if(locked(B.date))return;
  $("ed").onclick=function(){B.edit=true;B.from=B.date;B.Q={};for(var k in o.q)B.Q[k]=o.q[k];renderBranch()};
  $("cx").onclick=cancelOrder;
}
function list(){
  var F=freq(),cats=CATS.indexOf(B.chip);
  var arr=S.items.filter(function(it){
    if(B.chip==="자주 주문"&&!F[it.id])return false;
    if(cats>-1&&it.category!==CATS[cats])return false;
    if(B.only&&!(B.Q[it.id]>0))return false;
    return hit(it.name,B.qs);
  });
  if(B.chip==="전체")arr.sort(function(a,b){return (F[b.id]?1:0)-(F[a.id]?1:0)||a.sort-b.sort});
  $("list").innerHTML=arr.map(function(it){
    var n=B.Q[it.id]||0,pk=packTxt(it);
    return '<div class="row'+(n>0?' on':'')+'" data-i="'+it.id+'"><div class="name">'+(F[it.id]?'<i title="자주 주문">★</i>':'')+esc(it.name)+(S.fav[it.id]?'<span class="used">사용이력 있음</span>':'')+'</div><div class="sub">'+esc(it.category)+(pk?'<em class="ib">'+esc(pk)+'</em>':'')+'</div><div class="ctl"><div class="step"><button data-d="-1" aria-label="'+esc(it.name)+' 줄이기">−</button><input type="number" min="0" inputmode="decimal" value="'+n+'" aria-label="'+esc(it.name)+' 수량"><button data-d="1" aria-label="'+esc(it.name)+' 늘리기">+</button></div><span class="unit">'+esc(unitTxt(it))+'</span></div></div>';
  }).join("")||'<div class="empty">'+(B.only?'아직 선택한 품목이 없습니다.':(B.chip==="자주 주문"&&!B.qs)?'아직 주문 이력이 없어 자주 주문 품목이 없습니다.':'검색 결과가 없습니다. 다른 이름이나 초성으로 검색해 보세요.')+'</div>';
  var o=$("only");o.textContent=B.only?"전체 품목 보기":"주문한 품목만 보기 ("+total()+")";
}
function chips(){var c=$("chips");c.innerHTML="";["전체","자주 주문"].concat(CATS).forEach(function(n){var b=document.createElement("button");b.textContent=(n==="자주 주문"?"★ ":"")+n;b.setAttribute("aria-pressed",n===B.chip);b.onclick=function(){B.chip=n;chips();list()};c.appendChild(b)})}
function renderBranch(){
  showTop(S.branchName,false);
  var app=$("app");
  if(B.done){
    $("bar").style.display="none";
    app.innerHTML='<div class="done"><h2>'+esc(B.done.h)+'</h2><div class="meta">'+esc(B.done.m)+'</div>'+B.done.t+'<button class="ghost" id="again">새 주문 작성</button></div>';
    $("again").onclick=function(){B.done=null;B.date=tmr();renderBranch()};
    return;
  }
  $("bar").style.display="";
  app.innerHTML='<h1>주문서 작성</h1><div class="meta">전체 '+S.items.length+'개 품목</div>'+
   '<div class="banner">주문 마감: 납품 전날 23시까지 접수·수정·납품일 변경 · 23시~자정은 사장님 승인 후 반영 · 납품일 당일(자정 이후)은 변경 불가</div>'+
   '<div class="extra"><label>납품 희망일 (기본: 내일)<input type="date" id="dt" min="'+(B.edit?tmr():tdy())+'" value="'+B.date+'"></label><p class="note" id="nt"></p></div>'+
   '<div class="card" id="ex"></div>'+
   '<div class="tools"><input id="q" type="search" placeholder="품목 검색 (예: 양파, ㅇㅍ)" value="'+esc(B.qs)+'" aria-label="품목 검색"><div class="chips" id="chips"></div><button class="only" id="only"></button></div>'+
   '<div class="slip"><div id="list"></div></div>'+
   '<div class="extra"><label>요청사항<textarea id="mm" rows="2" placeholder="예: 새벽 5시 전 도착">'+esc(B.memo)+'</textarea></label></div>';
  $("q").oninput=function(e){B.qs=e.target.value;list()};
  $("only").onclick=function(){B.only=!B.only;list()};
  $("dt").onchange=function(e){var v=e.target.value||tmr();if(B.edit&&locked(v)){toast("오늘이나 지난 날짜로는 바꿀 수 없습니다. 내일 이후로 골라 주세요.");e.target.value=B.date;return}B.date=v;count();exr()};
  $("mm").oninput=function(e){B.memo=e.target.value};
  var L=$("list");
  function upd(r,id,v,w){B.Q[id]=v;if(w)r.querySelector("input").value=v;r.classList.toggle("on",v>0);count();$("only").textContent=B.only?"전체 품목 보기":"주문한 품목만 보기 ("+total()+")"}
  L.onclick=function(e){var b=e.target.closest("button");if(!b)return;var r=b.closest(".row"),id=r.dataset.i;upd(r,id,Math.max(0,+((B.Q[id]||0)+ +b.dataset.d).toFixed(1)),1)};
  L.oninput=function(e){var r=e.target.closest(".row"),v=parseFloat(e.target.value);upd(r,r.dataset.i,isNaN(v)||v<0?0:v,0)};
  chips();list();count();exr();
}
async function submitOrder(){
  if(B.busy)return;
  var q=pos(B.Q);if(!Object.keys(q).length)return;
  B.busy=true;$("go").disabled=true;$("go").textContent="처리 중…";
  var date=B.date,wasEdit=B.edit,mv=moving(),from=B.from;
  var r=mv?await sb.rpc("move_order",{p_from:from,p_to:date,p_lines:q,p_memo:B.memo.trim()})
          :await sb.rpc("submit_order",{p_date:date,p_lines:q,p_memo:B.memo.trim(),p_mode:wasEdit?"edit":"add"});
  B.busy=false;
  if(r.error){count();fail(r.error);return}
  var res=r.data||{};
  if(res.result==="requested"){
    B.done={h:"승인 요청이 접수되었습니다",m:mv?"납품일 "+fmt(from)+" → "+fmt(date)+" 변경은 마감이 지나 사장님 승인 후 반영됩니다":"마감이 지나 사장님 승인 후 반영됩니다 · 납품 희망일 "+fmt(date),t:tbl(q)};
    try{await fetchBranch()}catch(e){}
  }else{
    try{await fetchBranch()}catch(e){}
    var o=S.orders[date]||{q:q};
    B.done={h:mv?"납품일이 변경되었습니다":wasEdit?"주문이 수정되었습니다":res.kind==="추가합산"?"추가 주문이 합산되었습니다":"주문이 접수되었습니다",m:(mv?fmt(from)+" → ":"납품 희망일 ")+fmt(date),t:tbl(o.q)};
  }
  B.Q={};B.memo="";B.edit=false;B.from="";renderBranch();window.scrollTo(0,0);
}
async function cancelOrder(){
  var date=B.date;
  if(!confirm(fmt(date)+" 납품 주문을 취소할까요?"+(closed(date)?"\n마감이 지나 사장님 승인 후 취소됩니다.":"")))return;
  var r=await sb.rpc("cancel_order",{p_date:date});
  if(r.error){fail(r.error);return}
  var req=r.data&&r.data.result==="requested";
  try{await fetchBranch()}catch(e){}
  B.done={h:req?"취소 승인 요청이 접수되었습니다":"주문이 취소되었습니다",m:fmt(date)+" 납품 주문",t:req?'<p>마감이 지나 사장님 승인 후 취소됩니다.</p>':''};
  B.Q={};B.edit=false;renderBranch();window.scrollTo(0,0);
}

/* ===== 사장님 화면 ===== */
async function fetchAdmin(){
  await loadItems();
  var br=await sb.from("branches").select("id,name").order("id");if(br.error)throw br.error;A.branches=br.data;
  var rq=await sb.from("change_requests").select("id,branch_id,delivery_date,to_date,kind,lines,memo,status,created_at").eq("status","대기").order("created_at");
  if(rq.error)throw rq.error;A.reqs=rq.data;
  var ds={};ds[A.date]=1;A.reqs.forEach(function(r){ds[r.delivery_date]=1;if(r.to_date)ds[r.to_date]=1});
  var o=await sb.from("orders").select("id,branch_id,delivery_date,memo,order_lines(item_id,qty)").in("delivery_date",Object.keys(ds));
  if(o.error)throw o.error;
  A.orders={};o.data.forEach(function(x){var q={};x.order_lines.forEach(function(l){q[l.item_id]=num(l.qty)});A.orders[x.branch_id+"|"+x.delivery_date]={q:q,memo:x.memo}});
  var lg=await sb.from("activity_log").select("at,text").order("at",{ascending:false}).limit(15);
  A.log=lg.error?[]:lg.data;
}
async function loadAdmin(){
  if(!A.date)A.date=tmr();
  try{await fetchAdmin()}catch(e){fail(e);return}
  renderAdmin();
}
function bname(id){for(var i=0;i<A.branches.length;i++)if(A.branches[i].id===id)return A.branches[i].name;return "지점 "+id}
function aft(r){
  var o=A.orders[r.branch_id+"|"+(r.kind==="납품일변경"?r.to_date:r.delivery_date)],b=o?o.q:{},a={},k;
  if(r.kind==="취소")return a;
  if(r.kind==="수정"){for(k in r.lines)a[k]=num(r.lines[k]);return a}
  for(k in b)a[k]=b[k];
  for(k in r.lines)a[k]=+((a[k]||0)+num(r.lines[k])).toFixed(1);
  return a;
}
function cmp(r){
  var o=A.orders[r.branch_id+"|"+r.delivery_date],b=o?o.q:{},a=aft(r),all={},k;
  for(k in b)all[k]=1;for(k in a)all[k]=1;
  var mv=r.kind==="납품일변경";
  return '<table><tr><th>품명</th><th>'+(mv?fmt(r.delivery_date)+' 기존':'기존')+'</th><th>'+(mv?fmt(r.to_date)+' 반영 후':'반영 후')+'</th></tr>'+sortedIds(all).map(function(k){var x=b[k]||0,y=a[k]||0;return '<tr><td>'+esc(nm(k))+'</td><td style="font-weight:400">'+(x?x+un(k):'-')+'</td><td>'+(y?y+un(k):'삭제')+'</td></tr>'}).join('')+'</table>';
}
function renderAdmin(){
  showTop("사장님 관리",true);$("bar").style.display="none";
  var d=A.date,h='<h1>사장님 관리</h1><div class="meta">접수 현황과 승인 요청을 한곳에서 확인합니다</div>';
  h+='<h3>승인 대기함 ('+A.reqs.length+')</h3>';
  h+=A.reqs.length?A.reqs.map(function(r){
    return '<div class="card"><div class="ch"><b>'+esc(bname(r.branch_id))+'</b><span class="pill">'+esc(r.kind)+'</span><span>'+(r.kind==="납품일변경"?fmt(r.delivery_date)+' → '+fmt(r.to_date):fmt(r.delivery_date))+' 납품 · '+fmtAt(r.created_at)+' 요청</span></div>'+cmp(r)+(r.memo?'<p>요청사항: '+esc(r.memo)+'</p>':'')+'<div class="acts"><button class="ok" data-id="'+r.id+'" data-a="1">승인</button><button data-id="'+r.id+'" data-a="0">거절</button></div></div>';
  }).join(''):'<div class="empty">승인을 기다리는 요청이 없습니다.</div>';
  h+='<h3>거래처별 주문 내역</h3><label>납품일<input type="date" id="ad" value="'+d+'"></label><p class="note">'+(locked(d)?'납품일 당일 · 거래처 변경 불가':closed(d)?'접수 마감됨 · 자정 전까지 승인 요청 가능':'접수 중 · 마감 '+dl(d))+'</p>';
  var ok=A.branches.filter(function(b){return A.orders[b.id+"|"+d]}).length;
  h+='<p class="note">접수 '+ok+'곳 · 미접수 '+(A.branches.length-ok)+'곳</p>';
  h+='<p><button class="ghost" id="xb">엑셀로 내려받기</button></p>';
  h+=A.branches.slice().sort(function(a,b){return (A.orders[b.id+"|"+d]?1:0)-(A.orders[a.id+"|"+d]?1:0)||a.id-b.id}).map(function(b){
    var o=A.orders[b.id+"|"+d],n=o?Object.keys(o.q).length:0,pn=A.reqs.filter(function(r){return r.branch_id===b.id&&(r.delivery_date===d||r.to_date===d)}).length;
    return '<div class="card"><div class="ch"><b>'+esc(b.name)+'</b><span>'+(n?n+'개 품목':'주문 없음')+'</span>'+(pn?'<span class="pill">승인 대기 '+pn+'</span>':'')+'</div>'+(n?tbl(o.q)+(o.memo?'<p>요청사항: '+esc(o.memo)+'</p>':''):'<div class="empty">이 날짜에 접수된 주문이 없습니다.</div>')+'</div>';
  }).join('');
  h+='<h3>처리 이력</h3>'+(A.log.length?'<ul class="log">'+A.log.map(function(x){return '<li>'+esc(fmtAt(x.at))+' '+esc(x.text)+'</li>'}).join('')+'</ul>':'<div class="empty">아직 처리 내역이 없습니다.</div>');
  $("app").innerHTML=h;
  $("ad").onchange=function(e){A.date=e.target.value||tmr();loadAdmin()};
  $("xb").onclick=exportXlsx;
  document.querySelectorAll(".acts button[data-id]").forEach(function(b){b.onclick=function(){decide(+b.dataset.id,b.dataset.a==="1")}});
}
async function decide(id,okk){
  if(A.busy)return;
  if(!confirm(okk?"이 요청을 승인하고 주문에 반영할까요?":"이 요청을 거절할까요? 기존 주문은 그대로 유지됩니다."))return;
  A.busy=true;
  var r=await sb.rpc("admin_decide",{p_request_id:id,p_approve:okk});
  A.busy=false;
  if(r.error)fail(r.error);
  await loadAdmin();
}
function exportXlsx(){
  if(typeof XLSX==="undefined"){toast("엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");return}
  var rows=[["거래처","제품명","수량","단위","입수"]],first=true;
  A.branches.forEach(function(b){
    var o=A.orders[b.id+"|"+A.date];if(!o)return;
    if(!first){rows.push([],[])}
    first=false;
    sortedIds(o.q).forEach(function(k){var it=S.byId[k];rows.push([b.name,it?it.name:("품목 "+k),o.q[k],it?it.unit:"",it&&it.pack_qty>1?it.pack_qty:""])});
  });
  if(rows.length<2){toast("이 날짜에 내려받을 확정 주문이 없습니다.");return}
  var ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:32},{wch:46},{wch:8},{wch:8},{wch:6}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"주문내역");
  XLSX.writeFile(wb,"주문내역_"+A.date+".xlsx");
}

/* ===== 시작 ===== */
$("go").onclick=submitOrder;
$("lo").onclick=logout;
$("rf").onclick=function(){loadAdmin()};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S.role==="admin"&&!A.busy)loadAdmin()});
async function boot(){
  if(!sb){$("app").innerHTML='<div class="card"><b>서버 연결 도구를 불러오지 못했습니다.</b><p>인터넷 연결을 확인하고 새로고침해 주세요.</p></div>';return}
  var s=await sb.auth.getSession();
  if(s.data&&s.data.session)await enter();else showLogin();
  sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")showLogin()});
}
boot();
</script>
